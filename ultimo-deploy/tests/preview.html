<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia dos computadores</title><style>*{box-sizing:border-box}body{margin:0;background:#12232b;color:#e7e9d8;font:12px system-ui}nav{height:48px;display:flex;align-items:center;gap:8px;padding:6px;overflow:auto}button{background:#31564d;color:#fff;border:1px solid #7a9f83;padding:7px;white-space:nowrap;border-radius:4px}iframe{width:100%;height:calc(100dvh - 52px);border:0}nav small{white-space:nowrap}</style><nav><small>PRÉVIA · não salva</small><button data-demo="commits">Commits</button><button data-demo="network">Rede</button><button data-demo="database">Dados</button><button data-demo="santalog">Recuperação</button><button id="voices">Vozes</button><button id="finale-demo">Final</button><button id="secret-demo">Pós-crédito</button></nav><iframe id="preview" title="Prévia do jogo" src="../index.html"></iframe><script>
const frame=document.querySelector('iframe');let w,d;
frame.onload=async()=>{w=frame.contentWindow;d=w.document;for(let i=0;i<100&&!d.querySelector("#new-game");i++)await new Promise(r=>setTimeout(r,100));w.Campaign.save=()=>true;w.Campaign.load=()=>null;w.UI.state.started=false;w.UI.menu();d.querySelector('#new-game').click();d.querySelector('#finale-skip')?.click();for(let i=0;i<40&&!d.querySelector('#overlay').hidden&&d.querySelector('#next-line');i++)d.querySelector('#next-line').click();const s=w.UI.state;s.muted=false;w.Campaign.clue(s,'incident');for(const id of ['tiago',...w.Story.required])w.Campaign.talk(s,id);w.UI.onMove('factory',w.Engine.player);w.UI.interact('commits','object');};
document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>{if(!w?.UI)return;w.UI.close();const id=b.dataset.demo;if(id==='santalog'){for(const k of ['commits','network','database'])w.Campaign.solve(w.UI.state,k);w.UI.state.revealed=true;w.UI.state.helpers=['pinheiro','wanderson'];w.Campaign.sync(w.UI.state);}else{w.UI.state.solved[id]=false;w.Campaign.sync(w.UI.state);}w.Engine.enter(id==='network'?'server':id==='database'?'library':'factory');w.UI.interact(id,'object');});
document.querySelector('#voices').onclick=()=>{if(!w?.UI)return;w.UI.close();w.UI.interact('willian','npc');d.querySelector('#ask').click();};
document.querySelector('#finale-demo').onclick=()=>{if(!w?.UI)return;w.UI.close();const s=w.UI.state;for(const key of ['commits','network','database'])w.Campaign.solve(s,key);s.deduced=true;s.revealed=true;s.helpers=['pinheiro','wanderson'];s.setup=4;s.tests=true;s.extras=true;s.extraTests=true;w.Campaign.sync(s);w.Engine.enter('factory');w.UI.interact('santalog','object');d.querySelector('[data-open-app]').click();d.querySelector('#deploy').click();};
document.querySelector('#secret-demo').onclick=async()=>{w.UI.state.secrets=w.Secrets.items.map(x=>x.id);document.querySelector('#finale-demo').click();await new Promise(r=>setTimeout(r,1800));d.querySelector('#finale-skip')?.click();d.querySelector('#credits').click();d.querySelector('#postcredits-play').click();};</script></html>
