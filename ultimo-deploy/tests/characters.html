<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elenco • O Último Deploy</title><style>body{background:#14272b;color:#eeeada;font:16px system-ui;margin:35px}h1{font:32px Georgia}main{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:18px}article{background:#233c3c;padding:18px;border:1px solid #6c876b;border-radius:8px;text-align:center}canvas{image-rendering:pixelated}h2{font-size:15px}p{font-size:12px;color:#bbc8b6;min-height:30px}.sprite{width:60px;height:102px;object-fit:contain} @media(max-width:800px){main{grid-template-columns:repeat(2,1fr)}}</style><h1>O pessoal do plantão</h1><p>Sprites e retratos usados no jogo, gerados com os mesmos dados.</p><h2>Fabrício · perfil e caminhada</h2><div id="fabricio-frames" style="display:flex;gap:14px;flex-wrap:wrap;margin:20px 0"></div><main id="cast"></main><script src="../js/story.js"></script><script src="../js/characters.js"></script><script>for(const a of Object.values(Story.actors)){const card=document.createElement('article'),face=document.createElement('canvas');face.width=96;face.height=112;Characters.portrait(a,face);const sprite=Characters.sprite(a,'down',0);sprite.className='sprite';const title=document.createElement('h2');title.textContent=a.name;const desc=document.createElement('p');desc.textContent=a.role;card.append(face,sprite,title,desc);document.querySelector('#cast').append(card);}for(const dir of ['left','right','up','down']){const group=document.createElement('section');group.style.cssText='padding:12px;background:#28433e;border-radius:8px';const label=document.createElement('p');label.textContent=dir+' · quatro quadros';group.append(label);for(let frame=0;frame<4;frame++){const image=Characters.sprite(Story.actors.fabricio,dir,frame);image.style.cssText='width:60px;height:102px;image-rendering:pixelated';group.append(image);}document.querySelector('#fabricio-frames').append(group);}</script></html>
