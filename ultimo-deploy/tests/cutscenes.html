<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Conferência de cutscenes</title><style>body{margin:0;background:#12232b;color:#e7e9d8;font:13px system-ui}header{padding:10px;display:flex;gap:15px;align-items:center}button{padding:8px;background:#b7d6a6;border:0;border-radius:5px}iframe{width:100%;height:76vh;border:0}pre{white-space:pre-wrap;padding:12px;max-height:13vh;overflow:auto;margin:0}</style><header><button id="run">Conferir cutscenes completas</button><span id="status">Prévia isolada · não altera o progresso salvo</span></header><iframe id="game" src="../index.html"></iframe><pre id="result"></pre><script>
const frame=document.querySelector('#game'),report=document.querySelector('#result'),status=document.querySelector('#status');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
document.querySelector('#run').onclick=async()=>{
  const button=document.querySelector('#run');button.disabled=true;report.textContent='';let count=0;const errors=[];
  const w=frame.contentWindow,d=w.document;
  const onerror=e=>{if(e.filename?.includes('/js/'))errors.push(e.message);};w.addEventListener('error',onerror);
  const check=(ok,label)=>{if(!ok)throw Error(label);report.textContent+='✓ '+label+'\n';count++;report.scrollTop=report.scrollHeight;};
  const click=id=>{const el=d.getElementById(id);if(!el||el.disabled)throw Error('Controle ausente: '+id);el.click();};
  const until=async(fn,ms=60000)=>{const start=Date.now();while(!fn()){if(Date.now()-start>ms)throw Error('A cena não concluiu no tempo esperado.');await wait(50);}};
  const dialogue=()=>{let n=0;while(d.getElementById('next-line')&&n++<100)click('next-line');check(n<100,'Diálogo termina e devolve o controle');};
  try{
    await until(()=>w.UI&&d.getElementById('new-game'));
    w.Campaign.save=()=>true;w.Campaign.load=()=>null;w.UI.state.started=false;w.UI.menu();click('new-game');
    status.textContent='Abertura da Fábrica · aguardando conclusão natural';
    await until(()=>!w.Finale.active);check(!!d.getElementById('next-line'),'Abertura termina no diálogo inicial');dialogue();
    w.UI.interact('santalog','object');d.querySelector('[data-open-app]').click();click('initial-test');check(!!w.Engine.cinematic,'Teste do incidente abre a cutscene');dialogue();check(!w.Engine.cinematic&&w.UI.state.clues.includes('incident'),'Incidente termina e libera a investigação');
    const s=w.UI.state;for(const id of ['tiago',...w.Story.required])w.Campaign.talk(s,id);for(const id of ['commits','network','database'])w.Campaign.solve(s,id);s.deduced=true;s.revealed=true;s.helpers=['pinheiro','wanderson'];s.setup=4;s.tests=true;s.extras=true;s.extraTests=true;w.Campaign.sync(s);
    w.UI.interact('santalog','object');d.querySelector('[data-open-app]').click();click('deploy');await until(()=>w.Finale.active);
    status.textContent='Encerramento · saída, copa, lua e trenó (sem pular)';
    const phases=new Set();while(w.Finale.active){phases.add(d.getElementById('finale-stage')?.dataset.stage);await wait(50);}
    for(const phase of ['exit','walk','party','moon','santa'])check(phases.has(phase),'Cena exibida: '+phase);
    check(!!d.getElementById('christmas-photo'),'Final chega à foto da comemoração');
    w.UI.interact('willian','npc');check(!!d.getElementById('christmas-photo'),'Fim bloqueia diálogos repetidos com NPCs');
    click('credits');check(!d.getElementById('postcredits-play'),'Pós-crédito bloqueado sem os cinco segredos');s.secrets=w.Secrets.items.map(x=>x.id);click('credits-photo');click('credits');click('postcredits-play');
    status.textContent='Pós-crédito · Willian pendurado (sem pular)';const captions=new Set();
    while(w.Finale.active){captions.add(d.getElementById('finale-caption')?.textContent);await wait(50);}
    check([...captions].some(x=>x?.includes('SOCORRO')),'Willian pede socorro durante o voo');check([...captions].some(x=>x?.includes('HO HO HO')),'Papai Noel responde antes da foto');
    check(s.postcreditsSeen&&!!d.getElementById('secret-photo'),'Pós-crédito termina automaticamente na foto secreta');await until(()=>d.getElementById('secret-photo').complete);check(d.getElementById('secret-photo').naturalWidth>0,'Foto secreta carregada');
    click('secret-replay');check(w.Finale.active,'Rever a carona reinicia a cena');click('finale-skip');check(!!d.getElementById('secret-photo')&&!w.Finale.active,'Pular a repetição volta à foto sem travar');check(errors.length===0,'Nenhum erro do jogo: '+errors.join('; '));
    status.textContent=count+' verificações passaram · concluído';
  }catch(e){status.textContent='Falhou: '+e.message;report.textContent+='✗ '+e.stack;}finally{w.removeEventListener('error',onerror);button.disabled=false;}
};
</script></html>
